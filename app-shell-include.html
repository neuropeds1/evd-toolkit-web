<nav class="app-tab-bar" id="app-tab-bar">
  <a class="app-tab-item" data-tab="home" href="./index.html">
    <span class="app-tab-icon">🏠</span>
    <span>Home</span>
  </a>
  <button class="app-tab-item" data-tab="search" type="button" onclick="if (window.quartoOpenSearch) window.quartoOpenSearch();">
    <span class="app-tab-icon">🔍</span>
    <span>Search</span>
  </button>
  <a class="app-tab-item" data-tab="references" href="./references.html">
    <span class="app-tab-icon">📖</span>
    <span>References</span>
  </a>
  <a class="app-tab-item" data-tab="resources" href="./more.html">
    <span class="app-tab-icon">⋯</span>
    <span>Resources</span>
  </a>
</nav>

<script>
(function() {
  var path = location.pathname.split("/").pop() || "index.html";
  var map = { "index.html": "home", "references.html": "references", "more.html": "resources" };
  var active = map[path];
  if (!active) return;
  document.querySelectorAll(".app-tab-item").forEach(function(item) {
    if (item.getAttribute("data-tab") === active) item.classList.add("active");
  });
})();
</script>
