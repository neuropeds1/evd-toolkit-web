website:
  title: "EVD Toolkit"
  favicon: favicon.ico
  page-footer:
    center: |
      EVD Toolkit — educational use only, does not replace clinical judgment or institutional guidance.

      <div id="site-footer-stats" style="width:100%;text-align:center;padding-top:8px;font-size:13px;color:#8a94a6;">
      <span id="visitor-count-footer">👀 loading…</span>
      &nbsp;·&nbsp;
      <span id="country-count-footer"></span>
      &nbsp;·&nbsp;
      <span id="last-updated-footer"></span>
      </div>
      <script type="module">
      import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
      import { getFirestore, doc, onSnapshot, updateDoc, setDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
      const firebaseConfig = {
        apiKey: "AIzaSyD1FLnIrd86qOsFPLi5y1q_EIU0lhL5gxc",
        authDomain: "evdtoolkit.firebaseapp.com",
        projectId: "evdtoolkit",
        storageBucket: "evdtoolkit.firebasestorage.app",
        messagingSenderId: "1002374431151",
        appId: "1:1002374431151:web:fe3724bb1f39eb4744af5a"
      };
      const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const counterRef = doc(db, "Stats", "visitorCount");
      updateDoc(counterRef, { count: increment(1) }).catch(() => {});
      onSnapshot(counterRef, snapshot => {
        const el = document.getElementById("visitor-count-footer");
        if (el) el.textContent = `👀 ${(snapshot.data()?.count ?? 0).toLocaleString()} visitors`;
      });

      // Country tally: record this visitor's country (via a free,
      // no-signup IP geolocation lookup) into a de-duplicated Firestore
      // set, so the footer can show a running distinct-country count.
      const countriesRef = doc(db, "Stats", "visitorCountries");
      fetch("https://get.geojs.io/v1/ip/country.json")
        .then(res => res.json())
        .then(data => {
          if (data && data.country) {
            return setDoc(countriesRef, { codes: arrayUnion(data.country) }, { merge: true });
          }
        })
        .catch(() => {});
      onSnapshot(countriesRef, snapshot => {
        const el = document.getElementById("country-count-footer");
        const codes = snapshot.data()?.codes ?? [];
        if (!el || codes.length === 0) return;
        el.textContent = `🌍 ${codes.length} ${codes.length === 1 ? "country" : "countries"}`;
        try {
          const names = new Intl.DisplayNames(["en"], { type: "region" });
          const sorted = codes.map(c => names.of(c) ?? c).sort();
          el.title = sorted.join(", ");
        } catch (e) {
          el.title = codes.sort().join(", ");
        }
        el.style.cursor = "help";
      });

      // Last updated: pulled live from the repo's most recent commit
      // on main, so this never needs a manual edit again.
      fetch("https://api.github.com/repos/neuropeds1/evd-toolkit-web/commits/main")
        .then(res => res.json())
        .then(data => {
          const dateStr = data?.commit?.author?.date;
          const el = document.getElementById("last-updated-footer");
          if (!el || !dateStr) return;
          const formatted = new Date(dateStr).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
          el.textContent = `Last updated on ${formatted}`;
        })
        .catch(() => {});
      </script>
